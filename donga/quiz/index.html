<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>지원사업 정복 퀴즈</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
:root{
  --bg:#F4F7FC; --surface:#FFFFFF; --ink:#16213A; --muted:#5B6782; --line:#D7E0EE;
  --accent:#2457D6; --accent-soft:#E6EEFF; --on-accent:#FFFFFF;
  --ok:#0F7A4A; --ok-soft:#E3F5EC; --bad:#B42318; --bad-soft:#FDECEA;
  --font:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0F1524; --surface:#182136; --ink:#E8EDF7; --muted:#A3AFC7; --line:#2B3754;
  --accent:#7FA2FF; --accent-soft:#1E2B4D; --on-accent:#0F1524;
  --ok:#5FD39C; --ok-soft:#173528; --bad:#FF8A80; --bad-soft:#3A1C1C; color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.55}
.wrap{max-width:640px;margin:0 auto;padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
.eyebrow{font-size:13px;letter-spacing:.06em;color:var(--accent);font-weight:700}
h1{font-size:25px;margin:4px 0 0;font-weight:900;text-wrap:balance}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.meta{display:flex;justify-content:space-between;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.q{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:12px}
.q h2{margin:0;font-size:19px;line-height:1.45}
.opts{display:flex;flex-direction:column;gap:8px}
.opts button{font:inherit;text-align:left;padding:13px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.opts button:hover:not(:disabled){border-color:var(--accent)}
.opts button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.opts button.ok{border-color:var(--ok);background:var(--ok-soft);color:var(--ok);font-weight:700}
.opts button.bad{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.opts button:disabled{cursor:default}
.fb{border-radius:12px;padding:12px 14px;font-size:15px}
.fb.ok{background:var(--ok-soft)} .fb.bad{background:var(--bad-soft)}
.fb b{display:block;margin-bottom:2px}
.next{font:inherit;font-weight:700;font-size:16px;padding:13px;border-radius:12px;border:0;background:var(--accent);color:var(--on-accent);cursor:pointer}
.next:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.score{text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.score .big{font-size:56px;font-weight:900;color:var(--accent);line-height:1;font-variant-numeric:tabular-nums}
.review{font-size:14px;color:var(--muted);text-align:left;width:100%}
.review li{margin:4px 0}
footer{font-size:12.5px;color:var(--muted);text-align:center}
@media (prefers-reduced-motion: reduce){.bar i{transition:none}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="eyebrow">소상공인 지원사업 정복하기 · 복습 퀴즈</div>
  <h1>오늘 배운 것, 10문제로 확인</h1>
</header>
<div class="bar" aria-hidden="true"><i id="bar"></i></div>
<div class="meta"><span id="num"></span><span id="pts"></span></div>
<main id="stage"></main>
<footer>© 2026 바스제로컨설팅(VASZERO Consulting) · 강사 정경</footer>
</div>
<script>
const Q=[
 {q:"지원사업의 돈 가운데 ‘나중에 갚아야 하는 돈’은?",o:["보조금","정책자금(융자)","바우처","교육·컨설팅"],a:1,e:"정책자금은 시중보다 금리가 낮은 대출이라 상환 계획이 필요합니다. 보조금은 갚지 않지만 자부담·정산 의무가 있습니다."},
 {q:"다음 해 소상공인 지원사업 통합공고는 보통 언제 나올까요?",o:["3월 초","6월 말","9월 말","12월 말"],a:3,e:"전년 12월 말 통합공고가 나오고 주요 사업은 1~3월에 몰립니다. 그래서 10~11월은 서류·계좌·계획서를 준비하는 시기입니다."},
 {q:"공고문에서 ‘먼저 읽을 다섯 군데’에 들어가지 않는 것은?",o:["지원대상·제외대상","지원내용과 자부담","주관기관의 설립 연도","제출서류·평가항목·마감 시각"],a:2,e:"다섯 군데는 지원대상, 제외대상, 지원내용·자부담, 제출서류, 평가·일정(마감 시각)입니다."},
 {q:"소상공인24에서 신청서를 다 쓰고 ‘임시저장’만 눌렀다면?",o:["접수 완료","마감 후 자동 접수","접수되지 않은 상태","담당자가 연락해 줌"],a:2,e:"‘신청완료’까지 눌러야 접수됩니다. 제출 후 마이페이지에서 접수 상태를 확인하고 캡처해 두세요."},
 {q:"사업계획서 PSST의 순서로 맞는 것은?",o:["문제인식 → 실현가능성 → 성장전략 → 팀 구성","성장전략 → 문제인식 → 팀 구성 → 실현가능성","팀 구성 → 문제인식 → 실현가능성 → 성장전략","실현가능성 → 성장전략 → 문제인식 → 팀 구성"],a:0,e:"Problem(왜 필요한가) → Solution(어떻게 하나) → Scale-up(얼마나 커지나) → Team(누가 하나). 목차는 공고 서식을 따르고 칸 안을 PSST로 채웁니다."},
 {q:"‘요즘 장사가 어려워 지원이 꼭 필요합니다’를 평가기준에 맞게 고친다면?",o:["진심을 담아 더 길게 쓴다","최근 1년 매출 18% 감소처럼 숫자로 쓴다","‘반드시 성공하겠습니다’를 덧붙인다","지원금 금액을 먼저 쓴다"],a:1,e:"평가위원은 현황을 숫자로 봅니다. 현재 숫자 + 원인 + 해결 못 한 이유를 함께 쓰면 설득력이 올라갑니다."},
 {q:"AI가 ‘신청 가능합니다’라고 답했다면 다음에 할 일은?",o:["바로 신청한다","다른 AI에게 한 번 더 묻는다","AI가 말한 근거가 공고문 몇 쪽·어느 항목인지 직접 확인한다","주관기관에 AI 답변을 보낸다"],a:2,e:"AI 답은 자격 확정이 아닙니다. 근거 항목을 공고문 원문에서 직접 찾아 확인해야 합니다."},
 {q:"가상 공고(제외: ‘2027년 중 유사사업 수혜’)에서, 2026년에 유사사업을 받은 카드 B는 중복수혜 제한에?",o:["걸려서 신청 불가","해당 제한에 걸리지 않음","공고만으로는 판단 불가","무조건 감점"],a:1,e:"제외 조건은 ‘2027년 중’ 수혜입니다. 2026년 수혜는 이 제한에 걸리지 않습니다. 다른 자격 요건은 따로 확인해야 하고, 조항의 기간을 끝까지 읽는 습관이 중요합니다."},
 {q:"AI로 사업계획서를 다듬을 때 맞는 방법은?",o:["AI가 만든 매출 목표 숫자를 그대로 쓴다","주민번호·계좌까지 넣어 정확도를 높인다","내가 주지 않은 숫자는 [확인 필요]로 표시하게 한다","AI 문장을 그대로 복사해 제출한다"],a:2,e:"숫자는 내 실제 자료만 씁니다. 허위 기재는 선정 후에도 취소·환수 대상이고, 일부 공고는 AI 대조시스템으로 중복을 검토합니다."},
 {q:"‘성공률 90%, 착수금 먼저, 서류 대신 써 드립니다’라는 연락을 받았다면?",o:["믿을 만한 전문 대행이니 맡긴다","정부 공식 위탁기관으로 본다","불법 브로커를 의심하고 응하지 않은 채 확인·신고한다","정책자금 필수 절차로 따른다"],a:2,e:"성공률 보장·착수금 요구·서류 대리 작성은 대표적인 불법 브로커 의심 정황입니다. 이것만으로 불법이 확정되는 것은 아니지만, 응하지 말고 정책자금 누리집 ‘불법 브로커 신고센터’에 문의·신고하세요. 신청은 대표자 본인이 원칙이고, 브로커 개입이 확인되면 지원 취소·환수·참여 제한까지 받을 수 있습니다."}
];
let i=0,score=0,wrong=[];
const $=s=>document.querySelector(s);
function show(){
  $("#bar").style.width=(i/Q.length*100)+"%";
  if(i>=Q.length){return finish()}
  const it=Q[i];
  $("#num").textContent=`${i+1} / ${Q.length}`; $("#pts").textContent=`맞힌 문제 ${score}`;
  $("#stage").innerHTML=`<section class="q"><h2>Q${i+1}. ${it.q}</h2><div class="opts">${it.o.map((t,k)=>`<button type="button" data-k="${k}">${String.fromCharCode(9312+k)} ${t}</button>`).join("")}</div><div id="after"></div></section>`;
  document.querySelectorAll(".opts button").forEach(b=>b.addEventListener("click",()=>pick(+b.dataset.k)));
}
function pick(k){
  const it=Q[i],ok=k===it.a; if(ok)score++; else wrong.push(i);
  document.querySelectorAll(".opts button").forEach(b=>{const n=+b.dataset.k;b.disabled=true;if(n===it.a)b.classList.add("ok");else if(n===k)b.classList.add("bad")});
  $("#pts").textContent=`맞힌 문제 ${score}`;
  $("#after").innerHTML=`<div class="fb ${ok?"ok":"bad"}"><b>${ok?"정답입니다.":"아쉽습니다. 정답은 "+String.fromCharCode(9312+it.a)+"번"}</b>${it.e}</div><button type="button" class="next" id="nx">${i+1<Q.length?"다음 문제":"결과 보기"}</button>`;
  $("#nx").addEventListener("click",()=>{i++;show();window.scrollTo({top:0})});
  $("#nx").focus();
}
function finish(){
  $("#num").textContent="완료"; $("#pts").textContent="";
  const msg=score>=9?"지원사업 준비 완료! 오늘 바로 공고를 찾아보세요.":score>=6?"좋습니다. 틀린 문제만 다시 보면 충분합니다.":"교안의 공고 읽기·PSST 부분을 한 번 더 보세요.";
  $("#stage").innerHTML=`<section class="q score"><div>내 점수</div><div class="big">${score} / ${Q.length}</div><div>${msg}</div>${wrong.length?`<ol class="review">${wrong.map(n=>`<li><b>Q${n+1}</b> ${Q[n].e}</li>`).join("")}</ol>`:""}<button type="button" class="next" id="re" style="width:100%">다시 풀기</button><a class="next" style="width:100%;text-align:center;text-decoration:none" href="../">내 사업 맞춤 지원사업 찾기 →</a></section>`;
  $("#re").addEventListener("click",()=>{i=0;score=0;wrong=[];show()});
}
show();
</script>
</body>
</html>

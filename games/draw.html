<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>그림 맞히기 배틀</title>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@500;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--bg:#10131c;--y:#ffd23f;--g:#20b26b}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:#fff;font-family:'Noto Sans KR',sans-serif;min-height:100vh;overflow:hidden}
h1,h2,.disp{font-family:'Black Han Sans',sans-serif;font-weight:400}
button{font:inherit;font-weight:800;border:0;border-radius:14px;cursor:pointer}
[hidden]{display:none!important}
.btn{background:var(--y);color:#111;font-size:3vh;padding:1.5vh 4vh}
.btn.ghost{background:#ffffff22;color:#fff}

/* 큰 화면 */
#host{height:100vh;display:flex;flex-direction:column;padding:2.5vh 3vw}
#host header{display:flex;justify-content:space-between;align-items:center;min-height:7vh}
#host h1{font-size:5vh}#host h1 b{color:var(--y);font-weight:400}
#rnum{font-size:3vh;opacity:.8}
main{flex:1;display:flex;flex-direction:column;min-height:0;margin-top:2vh}
footer{display:flex;gap:1.5vw;align-items:center;margin-top:2vh}
#hostMsg{font-size:2.4vh;opacity:.85}

#lobby{flex:1;display:flex;gap:3vw;align-items:center}
.qrbox{background:#fff;color:#111;border-radius:24px;padding:3vh;text-align:center;width:34vw}
#qr{display:flex;justify-content:center;margin-bottom:2vh}#qr img,#qr canvas{width:28vh!important;height:28vh!important}
.qrbox p{font-size:2.6vh;font-weight:800}.qrbox small{display:block;margin-top:1vh;font-size:1.4vh;color:#666;word-break:break-all}
.plist{flex:1;height:62vh;border:4px solid var(--y);border-radius:24px;padding:2.5vh;overflow:hidden}
.plist h2{color:var(--y);font-size:4.5vh;margin-bottom:1.5vh}
.plist ul{list-style:none;display:flex;flex-wrap:wrap;gap:1vh}
.plist li{background:#ffffff22;padding:.6vh 1.6vh;border-radius:99px;font-size:2.4vh;font-weight:800}

#stage{flex:1;display:flex;gap:2.5vw;min-height:0}
.board{position:relative;align-self:flex-start}
#cv{width:68vh;height:68vh;background:#fff;border-radius:20px;display:block}
#reveal{position:absolute;inset:0;background:#000b;border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
#reveal .disp{font-size:12vh;color:var(--y)}#reveal p{font-size:3vh;margin-top:2vh;padding:0 3vh;line-height:1.5}
.info{flex:1;display:flex;flex-direction:column;min-width:0}
#drawer{font-size:3.4vh;font-weight:800}#drawer b{color:var(--y)}
#hint{font-family:'Black Han Sans';font-size:8vh;letter-spacing:2vh;margin:2vh 0}
#hint small{font-size:3vh;letter-spacing:0;opacity:.7;margin-left:1vh}
#timer{font-family:'Black Han Sans';font-size:7vh;color:var(--y)}
#feed{flex:1;list-style:none;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;gap:1vh;font-size:2.8vh;margin-top:2vh}
#feed li{background:#ffffff14;padding:1vh 2vh;border-radius:12px}
#feed li.ok{background:var(--g);font-weight:800}
#feed li b{color:var(--y)}#feed li.ok b{color:#fff}

#gallery{flex:1;display:flex;flex-direction:column;min-height:0}
#gallery h2{font-size:5vh;color:var(--y);text-align:center;margin-bottom:2vh}
#gGrid{flex:1;display:grid;grid-template-columns:repeat(4,1fr);gap:2vh;align-content:start}
.gi{background:#ffffff14;border-radius:16px;padding:1.2vh;text-align:center;position:relative}
.gi img{width:100%;aspect-ratio:1;background:#fff;border-radius:10px;display:block}
.gi .no{position:absolute;top:0;left:0;background:var(--y);color:#111;font-family:'Black Han Sans';font-size:4vh;padding:.2vh 1.6vh;border-radius:16px 0 16px 0}
.gi p{font-size:2.2vh;margin-top:.8vh}.gi .v{font-family:'Black Han Sans';color:var(--y);font-size:3vh}
.gi.win{outline:6px solid var(--y)}
#gGrid.few{grid-template-columns:repeat(3,1fr);padding:0 8vw}
#editor{position:fixed;inset:0;background:#000d;z-index:6;display:flex;flex-direction:column;gap:1.5vh;padding:4vh 10vw}
#editor h2{font-size:3.6vh;color:var(--y)}#editor p{font-size:2vh;opacity:.85;line-height:1.6}
#editor textarea{flex:1;font:500 2.2vh/1.6 'Noto Sans KR',sans-serif;padding:2vh;border-radius:14px;border:0;resize:none}

/* 참가자 폰 */
#player{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;text-align:center}
#joinBox{width:100%}
#joinBox h1{font-size:32px;margin-bottom:24px}
#nameIn,#guessIn{width:100%;font-size:22px;padding:16px;border-radius:14px;border:0;text-align:center}
#nameIn{margin-bottom:14px}
#joinBtn,#guessBtn{width:100%;background:var(--y);color:#111;font-size:22px;padding:16px}
#pMsg{margin-top:16px;font-size:17px;opacity:.85;line-height:1.5}
#pGame{width:100%}
#pHead{font-size:17px;opacity:.8;margin-bottom:8px}
#pBig{font-family:'Black Han Sans';font-size:44px;line-height:1.25;margin:10px 0}
#pSub{white-space:pre-line;font-size:19px;opacity:.9;line-height:1.5;margin-bottom:12px}
#pad{width:100%;aspect-ratio:1;background:#fff;border-radius:14px;touch-action:none;display:block}
#tools{display:flex;gap:8px;margin-top:10px}
#tools button{flex:1;height:52px;font-size:16px;color:#fff}
#tools button.on{outline:4px solid var(--y)}
#guessBox{display:flex;flex-direction:column;gap:10px}
#votes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#votes button{background:#ffffff22;color:#fff;padding:16px 8px;font-size:18px}
#votes button b{display:block;font-family:'Black Han Sans';font-size:30px;color:var(--y)}
#votes button:disabled{opacity:.3}
body.good{background:#11522f}
/* 세로 화면(폰·태블릿)에서 진행할 때 */
@media (max-aspect-ratio:1/1){
  body{overflow:auto}
  #host{height:auto;min-height:100vh;padding:16px}
  #host h1{font-size:24px}#qnum,#rnum{font-size:15px}
  main{margin-top:12px}
  #lobby{flex-direction:column;gap:14px;align-items:stretch}
  .qrbox{width:100%;padding:16px}
  #qr img,#qr canvas{width:58vw!important;height:58vw!important}
  .qrbox p{font-size:17px}.qrbox small{font-size:11px}
  .plist,.teams{height:auto;min-height:28vh;padding:14px}
  .plist h2,.team h2{font-size:22px}.plist .tip{font-size:13px}
  .plist li,.team li{font-size:14px}
  .teams{flex-direction:row;gap:10px}
  #teams{height:auto;grid-template-columns:1fr 1fr!important;gap:10px}
  footer{flex-wrap:wrap;gap:8px}
  .btn{font-size:16px;padding:11px 16px}
  #hostMsg{font-size:13px;width:100%}
  #timer{font-size:30px}
  /* 1 줄다리기 */
  #arena{flex-direction:column;gap:12px}
  #arena .side{width:auto}#arena .side h2{font-size:24px}#arena .side .big{font-size:48px}
  .field{width:100%;flex:none;height:30vh}
  /* 2 퀴즈 · 5 CS */
  #qText{font-size:22px;min-height:0;padding:8px 0 14px}
  #opts{grid-template-columns:1fr;gap:8px}
  .opt{font-size:17px;padding:12px 14px;gap:10px}
  .opt .sh{font-size:20px;width:24px}.opt .k{font-size:24px;min-width:20px}
  .opt .cnt,.opt .sc{font-size:20px}
  #side,#bottom{flex-wrap:wrap;gap:6px;font-size:14px}
  #top5,#teamBar{flex-wrap:wrap;font-size:14px}#teamBar span{font-size:15px}
  #sit{font-size:18px;padding:14px}#sit small{font-size:12px}
  #explain{font-size:15px;padding:12px}
  /* 3 그림 */
  #stage{flex-direction:column;gap:12px}
  #cv{width:calc(100vw - 32px);height:calc(100vw - 32px)}
  #drawer{font-size:18px}#hint{font-size:32px;letter-spacing:6px;margin:6px 0}#hint small{font-size:14px}
  #feed{font-size:15px}
  #gGrid,#gGrid.few{grid-template-columns:1fr 1fr;padding:0}
  .gi p{font-size:13px}.gi .no{font-size:18px}
  #gallery h2,#gTitle{font-size:20px}
  /* 4 밸런스 */
  #vs{flex-direction:column;gap:10px}
  #vs .side{min-height:24vh}
  #vs .side .txt{font-size:28px}#vs .side .pct{font-size:40px;margin-top:6px}
  .vsmark{width:56px;height:56px;font-size:24px}
  /* 최종 화면 */
  #final h2{font-size:28px;margin-bottom:18px}
  .pod{width:28vw}.pod .nm{font-size:16px}.pod .sc{font-size:13px}.pod .blk{font-size:30px}
  .p1 .blk{height:18vh}.p2 .blk{height:13vh}.p3 .blk{height:9vh}
  #rest,#finalNote,#mvp{font-size:15px}
  #bars{width:100%}.bar{font-size:16px}.bar .nm,.bar .v{width:auto;min-width:56px}.bar .tr{height:28px}
  #overlay h2{font-size:44px}#overlay p{font-size:18px}
  /* 문제 넣기 창 */
  #editor{flex-direction:column;padding:16px;overflow:auto}
  #editor h2{font-size:18px}#editor .note,#editor p{font-size:13px}
  #editor textarea{min-height:30vh;font-size:14px}
}
</style>
</head>
<body>

<section id="host" hidden>
  <header><h1>그림 맞히기 <b>배틀</b></h1><div id="rnum"></div></header>
  <main>
    <div id="lobby">
      <div class="qrbox"><div id="qr"></div><p>QR 찍고 이름만 쓰면 참가!</p><small id="url">연결 준비 중…</small></div>
      <div class="plist"><h2>참가자 <span id="pc">0</span>명</h2><ul id="pl"></ul></div>
    </div>
    <div id="stage" hidden>
      <div class="board"><canvas id="cv" width="800" height="800"></canvas><div id="reveal" hidden></div></div>
      <div class="info">
        <div id="drawer"></div>
        <div id="hint"></div>
        <div id="timer"></div>
        <ul id="feed"></ul>
      </div>
    </div>
    <div id="gallery" hidden><h2 id="gTitle"></h2><div id="gGrid"></div></div>
  </main>
  <footer>
    <button class="btn" id="startBtn">게임 시작</button>
    <button class="btn ghost" id="editBtn">제시어 바꾸기</button>
    <button class="btn" id="nextBtn" hidden>다음 그림</button>
    <span id="hostMsg"></span>
  </footer>
  <div id="editor" hidden>
    <h2>제시어 목록</h2>
    <p>쉼표나 줄바꿈으로 구분해 주세요. 회사·강의 주제에 맞는 단어를 넣으면 더 재미있어요. (예: 우리 회사 제품명, 사장님 말버릇…) 그리기 쉬운 물건·장소가 좋아요.</p>
    <textarea id="wordBox"></textarea>
    <div style="display:flex;gap:1vw;align-items:center"><button class="btn" id="saveBtn">저장</button><button class="btn ghost" id="closeBtn">닫기</button><span id="wordMsg" style="font-size:2.2vh"></span></div>
  </div>
</section>

<section id="player" hidden>
  <div id="joinBox">
    <h1>그림 맞히기 배틀</h1>
    <input id="nameIn" maxlength="10" placeholder="이름 (예: 김대리)">
    <button id="joinBtn">참가하기</button>
    <p id="pMsg"></p>
  </div>
  <div id="pGame" hidden>
    <div id="pHead"></div><div id="pBig"></div><div id="pSub"></div>
    <div id="drawBox" hidden>
      <canvas id="pad" width="600" height="600"></canvas>
      <div id="tools">
        <button data-c="#111" style="background:#111" class="on">검정</button>
        <button data-c="#e8384f" style="background:#e8384f">빨강</button>
        <button data-c="#2f7bff" style="background:#2f7bff">파랑</button>
        <button data-c="#fff" style="background:#888">지우개</button>
        <button id="clearBtn" style="background:#444">전체삭제</button>
      </div>
    </div>
    <div id="guessBox" hidden><input id="guessIn" maxlength="15" placeholder="정답 입력"><button id="guessBtn">보내기</button></div>
    <div id="votes"></div>
  </div>
</section>

<script>
const ROUND_SEC = 60;   // 그림 한 장 제한 시간
const MAX_ROUNDS = 8;   // shortcut: 참가자가 많아도 앞에서부터 8명만 그림 — 더 필요하면 숫자만 올리면 됨
const WORDS = '커피,회식,야근,월급날,컴퓨터,키보드,프린터,엘리베이터,노트북,휴가,비행기,치킨,삼겹살,노래방,고양이,강아지,로봇,스마트폰,카메라,우산,시계,달력,산타,눈사람,크리스마스트리,선물상자,케이크,풍선,축구공,자전거,자동차,신호등,피자,라면,햄버거,안경,넥타이,모니터,택배,커피믹스';
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const norm = s => String(s).replace(/\s/g, '').toLowerCase();
const parseWords = t => [...new Set(String(t).split(/[,\n]/).map(w => w.trim()).filter(w => w && w.length <= 12))];
const points = (ms, limit) => 100 + Math.round(100 * Math.max(0, 1 - ms / limit)); // 맞히면 100 + 빠를수록 최대 100
const mask = w => [...w].map(ch => ch === ' ' ? ' ' : '○').join('');

console.assert(norm(' 크리스마스 트리 ') === norm('크리스마스트리'), 'norm');
console.assert(parseWords('커피, 라면\n커피\n\n아주아주아주아주긴단어입니다').join() === '커피,라면', 'parseWords');
console.assert(points(0, 60000) === 200 && points(60000, 60000) === 100, 'points');

const joinId = new URLSearchParams(location.search).get('join');
if (typeof Peer === 'undefined') document.body.innerHTML = '<p style="padding:40px;font-size:22px">인터넷 연결을 확인하고 새로고침해 주세요.</p>';
else if (joinId) startPlayer(joinId); else startHost();

/* ---------- 큰 화면(진행자) ---------- */
function startHost() {
  $('host').hidden = false;
  const id = 'draw-' + Math.random().toString(36).slice(2, 8);
  const peer = new Peer(id);
  const players = new Map();
  const ctx = $('cv').getContext('2d');
  let words = parseWords(WORDS), phase = 'lobby', round = -1, order = [], R = null, gallery = [], timers = [];

  $('wordBox').value = words.join(', ');
  peer.on('open', () => {
    const url = location.origin + location.pathname + '?join=' + id;
    new QRCode($('qr'), { text: url, width: 300, height: 300 });
    $('url').textContent = url;
  });
  peer.on('error', e => $('hostMsg').textContent = '연결 오류: ' + e.type + ' — 새로고침해 주세요');
  peer.on('connection', conn => {
    conn.on('data', d => onData(conn, d));
    conn.on('close', () => {
      const p = players.get(conn.peer); players.delete(conn.peer); renderLobby();
      if (p && R && p === R.drawer && phase === 'draw') endRound('그린 사람의 연결이 끊겼어요');
    });
  });

  function onData(conn, d) {
    if (!d || typeof d !== 'object') return;
    const p = players.get(conn.peer);
    if (d.type === 'join' && !p) {
      const np = { name: String(d.name || '').trim().slice(0, 10) || '익명', score: 0, conn, lastGuess: 0, voted: false };
      players.set(conn.peer, np);
      tell(np); renderLobby();
      return;
    }
    if (!p) return;
    if (phase === 'draw' && p === R.drawer) {
      if (d.type === 'clear') { R.strokes = []; redraw(); }
      if (d.type === 'draw' && Array.isArray(d.s)) {
        const pts = d.s.filter(q => Array.isArray(q) && q.length === 2 && q.every(n => Number.isFinite(n) && n >= 0 && n <= 1)).slice(0, 200);
        if (d.new || !R.strokes.length) R.strokes.push({ c: /^#[0-9a-f]{3,6}$/i.test(d.c) ? d.c : '#111', pts: [] });
        const st = R.strokes[R.strokes.length - 1];
        const from = st.pts.length; st.pts.push(...pts); drawStroke(st, Math.max(0, from - 1));
      }
    }
    if (d.type === 'guess' && phase === 'draw' && p !== R.drawer && !R.solved.has(p)) {
      const now = Date.now(); if (now - p.lastGuess < 700) return; p.lastGuess = now;
      const text = String(d.text || '').trim().slice(0, 15); if (!text) return;
      if (norm(text) === norm(R.word)) {
        const g = points(now - R.start, ROUND_SEC * 1000);
        p.score += g; R.drawer.score += 50; R.solved.add(p);
        feed(`🎉 <b>${esc(p.name)}</b> 정답! +${g}`, true);
        tell(p);
        if (R.solved.size >= players.size - 1) endRound();
      } else feed(`<b>${esc(p.name)}</b> ${esc(text)}`);
    }
    if (d.type === 'vote' && phase === 'vote' && !p.voted) {
      const g = gallery[Number(d.i)];
      if (!g || g.drawerId === conn.peer) return;
      g.votes++; p.voted = true; tell(p);
      renderGallery();
      if ([...players.values()].every(x => x.voted)) showResult();
    }
  }

  function roleOf(p) { return R && p === R.drawer ? 'draw' : 'guess'; }
  function tell(p) {
    if (!p.conn.open) return;
    const s = { type: 'state', phase, round, total: order.length };
    if (R && (phase === 'draw' || phase === 'roundEnd')) Object.assign(s, { role: roleOf(p), drawerName: R.drawer.name, hint: mask(R.word), solved: R.solved.has(p) });
    if (R && phase === 'draw' && p === R.drawer) s.word = R.word;
    if (R && phase === 'roundEnd') s.word = R.word;
    if (phase === 'vote') Object.assign(s, { items: gallery.map((g, i) => ({ i, name: g.name, word: g.word, mine: g.drawerId === p.conn.peer })), voted: p.voted });
    if (phase === 'result') { const rk = ranked(); Object.assign(s, { rank: rk.indexOf(p) + 1, n: rk.length, score: p.score, funny: funnyWinners().some(g => g.drawerId === p.conn.peer) }); }
    p.conn.send(s);
  }
  const tellAll = () => players.forEach(tell);
  const ranked = () => [...players.values()].sort((a, b) => b.score - a.score);
  const funnyWinners = () => { const m = Math.max(0, ...gallery.map(g => g.votes)); return m ? gallery.filter(g => g.votes === m) : []; };

  function renderLobby() {
    $('pc').textContent = players.size;
    $('pl').innerHTML = [...players.values()].map(p => `<li>${esc(p.name)}</li>`).join('');
    if (phase === 'lobby') $('hostMsg').textContent = players.size < 2 ? '2명 이상 모이면 시작할 수 있어요' : `${players.size}명 참가 · 그림 ${Math.min(players.size, MAX_ROUNDS)}장`;
  }
  function show(v) { ['lobby', 'stage', 'gallery'].forEach(x => $(x).hidden = x !== v); }
  function feed(html, ok) {
    const li = document.createElement('li'); li.innerHTML = html; if (ok) li.className = 'ok';
    $('feed').appendChild(li); while ($('feed').children.length > 9) $('feed').firstChild.remove();
  }

  // 그리기
  function drawStroke(st, from) {
    const W = $('cv').width;
    ctx.strokeStyle = st.c; ctx.lineWidth = st.c === '#fff' ? 40 : 10; ctx.lineCap = ctx.lineJoin = 'round';
    ctx.beginPath();
    st.pts.slice(from).forEach(([x, y], i) => i ? ctx.lineTo(x * W, y * W) : ctx.moveTo(x * W, y * W));
    if (st.pts.length - from === 1) ctx.lineTo(st.pts[from][0] * W + .1, st.pts[from][1] * W);
    ctx.stroke();
  }
  function redraw() { ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, 800, 800); (R ? R.strokes : []).forEach(s => drawStroke(s, 0)); }

  // 제시어
  $('editBtn').onclick = () => { $('editor').hidden = false; $('wordMsg').textContent = `${words.length}개`; };
  $('closeBtn').onclick = () => $('editor').hidden = true;
  $('wordBox').oninput = () => $('wordMsg').textContent = `${parseWords($('wordBox').value).length}개`;
  $('saveBtn').onclick = () => { const w = parseWords($('wordBox').value); if (w.length) { words = w; $('editor').hidden = true; } };

  $('startBtn').onclick = () => {
    if (players.size < 2) { $('hostMsg').textContent = '2명 이상 있어야 시작할 수 있어요'; return; }
    players.forEach(p => { p.score = 0; p.voted = false; });
    order = [...players.values()].slice(0, MAX_ROUNDS);
    const pool = [...words].sort(() => Math.random() - .5);
    order = order.map((p, i) => ({ p, word: pool[i % pool.length] }));
    gallery = []; round = -1;
    $('startBtn').hidden = $('editBtn').hidden = true;
    nextRound();
  };
  $('nextBtn').onclick = () => {
    if (phase === 'roundEnd') round + 1 < order.length ? nextRound() : startVote();
    else if (phase === 'vote') showResult();
  };

  function nextRound() {
    timers.forEach(clearTimeout); timers = [];
    round++;
    // 그릴 차례인 사람이 나갔으면 건너뜀
    while (round < order.length && !players.has(order[round].p.conn.peer)) round++;
    if (round >= order.length) return startVote();
    const { p, word } = order[round];
    R = { drawer: p, word, strokes: [], solved: new Set(), start: Date.now() };
    phase = 'draw'; show('stage'); redraw();
    $('reveal').hidden = true; $('nextBtn').hidden = true; $('feed').innerHTML = ''; $('hostMsg').textContent = '';
    $('rnum').textContent = `그림 ${round + 1} / ${order.length}`;
    $('drawer').innerHTML = `<b>${esc(p.name)}</b> 님이 그리는 중 ✏️`;
    $('hint').innerHTML = mask(word) + `<small>${[...word.replace(/\s/g, '')].length}글자</small>`;
    tellAll(); tick();
  }
  function tick() {
    if (phase !== 'draw') return;
    const left = ROUND_SEC * 1000 - (Date.now() - R.start);
    $('timer').textContent = Math.max(0, Math.ceil(left / 1000)) + '초';
    if (left <= 0) endRound(); else timers.push(setTimeout(tick, 250));
  }
  function endRound(msg) {
    if (phase !== 'draw') return;
    phase = 'roundEnd'; timers.forEach(clearTimeout); timers = [];
    gallery.push({ img: $('cv').toDataURL('image/png'), name: R.drawer.name, drawerId: R.drawer.conn.peer, word: R.word, votes: 0 });
    $('timer').textContent = '';
    const who = [...R.solved].map(p => esc(p.name)).join(', ');
    $('reveal').innerHTML = `<div class="disp">${esc(R.word)}</div><p>${msg ? esc(msg) + '<br>' : ''}${who ? '맞힌 사람: ' + who : '아무도 못 맞혔어요 😂'}</p>`;
    $('reveal').hidden = false;
    $('nextBtn').textContent = round + 1 < order.length ? '다음 그림' : '웃긴 그림 투표';
    $('nextBtn').hidden = false;
    tellAll();
  }

  function startVote() {
    phase = 'vote'; R = null; show('gallery'); $('rnum').textContent = '';
    $('gTitle').textContent = '😂 가장 웃긴 그림에 투표하세요! (내 그림 빼고)';
    $('nextBtn').textContent = '투표 마감'; $('nextBtn').hidden = false;
    renderGallery(); tellAll();
  }
  function renderGallery(winners = []) {
    $('gGrid').className = gallery.length <= 3 ? 'few' : '';
    $('gGrid').innerHTML = gallery.map((g, i) => `<div class="gi${winners.includes(g) ? ' win' : ''}"><img src="${g.img}"><span class="no">${i + 1}</span><p>${esc(g.name)} · ${esc(g.word)}</p><div class="v">${phase === 'vote' ? '' : g.votes + '표'}</div></div>`).join('');
    if (phase === 'vote') $('hostMsg').textContent = `투표 ${[...players.values()].filter(p => p.voted).length} / ${players.size}`;
  }
  function showResult() {
    if (phase !== 'vote') return;
    phase = 'result';
    const w = funnyWinners(), rk = ranked();
    renderGallery(w);
    $('gTitle').textContent = (w.length ? `😂 웃긴 그림상: ${w.map(g => g.name).join(', ')}` : '😂 투표가 없었어요') + `   🏆 점수 1위: ${rk[0] ? rk[0].name + ' ' + rk[0].score + '점' : '-'}`;
    $('hostMsg').textContent = rk.slice(0, 5).map((p, i) => `${i + 1}위 ${p.name} ${p.score}`).join(' · ');
    $('nextBtn').hidden = true;
    $('startBtn').textContent = '처음부터 다시'; $('startBtn').hidden = $('editBtn').hidden = false;
    tellAll();
  }
  renderLobby();
}

/* ---------- 참가자 폰 ---------- */
function startPlayer(hostId) {
  $('player').hidden = false;
  let conn, color = '#111', pending = [], newStroke = false, last = null;
  const pad = $('pad'), pctx = pad.getContext('2d');

  $('joinBtn').onclick = () => {
    const name = $('nameIn').value.trim();
    if (!name) { $('pMsg').textContent = '이름을 입력해 주세요'; return; }
    $('joinBtn').disabled = true; $('pMsg').textContent = '연결 중…';
    const peer = new Peer();
    peer.on('error', e => { $('pMsg').textContent = '연결 실패 — QR을 다시 찍어 주세요 (' + e.type + ')'; $('joinBtn').disabled = false; });
    peer.on('open', () => {
      conn = peer.connect(hostId, { reliable: true });
      conn.on('open', () => conn.send({ type: 'join', name }));
      conn.on('data', onState);
      conn.on('close', () => view('', '연결이 끊겼어요', 'QR을 다시 찍어 주세요'));
    });
  };

  // 그리기 패드: 좌표를 0~1로 바꿔 0.05초마다 묶어 보냄
  const pos = e => { const r = pad.getBoundingClientRect(); return [Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)), Math.min(1, Math.max(0, (e.clientY - r.top) / r.height))].map(n => Math.round(n * 1000) / 1000); };
  function line(a, b) {
    pctx.strokeStyle = color; pctx.lineWidth = color === '#fff' ? 30 : 8; pctx.lineCap = 'round';
    pctx.beginPath(); pctx.moveTo(a[0] * 600, a[1] * 600); pctx.lineTo(b[0] * 600 + .1, b[1] * 600); pctx.stroke();
  }
  pad.onpointerdown = e => { pad.setPointerCapture(e.pointerId); last = pos(e); newStroke = true; pending = [last]; line(last, last); };
  pad.onpointermove = e => { if (!last) return; const p = pos(e); line(last, p); last = p; pending.push(p); };
  pad.onpointerup = pad.onpointercancel = () => { flush(); last = null; };
  function flush() {
    if (!pending.length || !conn || !conn.open) return;
    conn.send({ type: 'draw', s: pending, c: color, new: newStroke });
    pending = last ? [last] : []; newStroke = false;
  }
  setInterval(() => { if (last && pending.length > 1) flush(); }, 50);
  document.querySelectorAll('#tools [data-c]').forEach(b => b.onclick = () => {
    color = b.dataset.c; document.querySelectorAll('#tools [data-c]').forEach(x => x.classList.toggle('on', x === b));
  });
  $('clearBtn').onclick = () => { pctx.fillStyle = '#fff'; pctx.fillRect(0, 0, 600, 600); conn.send({ type: 'clear' }); };

  const sendGuess = () => {
    const t = $('guessIn').value.trim(); if (!t) return;
    conn.send({ type: 'guess', text: t }); $('guessIn').value = ''; $('guessIn').focus();
  };
  $('guessBtn').onclick = sendGuess;
  $('guessIn').onkeydown = e => { if (e.key === 'Enter') sendGuess(); };

  function view(head, big, sub, opt = {}) {
    $('joinBox').hidden = true; $('pGame').hidden = false;
    $('pHead').textContent = head; $('pBig').textContent = big; $('pSub').textContent = sub;
    $('drawBox').hidden = !opt.draw; $('guessBox').hidden = !opt.guess; $('votes').innerHTML = '';
    document.body.className = opt.good ? 'good' : '';
  }
  let lastRound = -1;
  function onState(d) {
    if (!d || d.type !== 'state') return;
    const head = d.round >= 0 && d.total ? `그림 ${d.round + 1} / ${d.total}` : '';
    if (d.phase === 'lobby') view('', '참가 완료!', '큰 화면을 보며 시작을 기다려 주세요');
    if (d.phase === 'draw' && d.role === 'draw') {
      if (d.round !== lastRound) { pctx.fillStyle = '#fff'; pctx.fillRect(0, 0, 600, 600); lastRound = d.round; }
      view(head, d.word, '이 단어를 그려 주세요! 글자는 쓰면 안 돼요 🤫', { draw: true });
    }
    if (d.phase === 'draw' && d.role === 'guess') {
      if (d.solved) view(head, '정답! 🎉', '다른 사람이 맞힐 때까지 기다려요', { good: true });
      else { view(head, d.hint, `${d.drawerName} 님 그림을 보고 맞혀 보세요`, { guess: true }); }
    }
    if (d.phase === 'roundEnd') view(head, d.word, d.role === 'draw' ? '수고했어요! 큰 화면을 보세요' : '정답이었어요', { good: d.solved });
    if (d.phase === 'vote') {
      view('투표', '가장 웃긴 그림은?', d.voted ? '투표 완료! 결과를 기다려요' : '큰 화면 번호를 보고 골라 주세요');
      if (!d.voted) d.items.forEach(it => {
        const b = document.createElement('button');
        b.innerHTML = `<b>${it.i + 1}</b>${esc(it.name)}<br>${esc(it.word)}`;
        b.disabled = it.mine;
        b.onclick = () => conn.send({ type: 'vote', i: it.i });
        $('votes').appendChild(b);
      });
    }
    if (d.phase === 'result') view('최종 결과', `${d.rank}위`, `${d.n}명 중 · ${d.score}점${d.funny ? '\n😂 웃긴 그림상 수상!' : ''}`, { good: d.rank <= 3 || d.funny });
  }
}
</script>
